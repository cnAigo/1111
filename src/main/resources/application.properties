spring.application.name=testvue
aes.secret-key=TaaS2026!SecureX
spring.main.banner-mode=off
spring.web.resources.static-locations=classpath:/static/,file:target/allure-report
logging.level.com.microsoft.playwright=OFF
logging.level.org.apache.http=ERROR
logging.level.org.springframework=WARN
logging.level.root=info
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.example.testvue=DEBUG

# Default: H2 in-memory (works without MySQL)
spring.datasource.url=jdbc:h2:mem:taas;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.profiles.active=mysql
# MySQL config overrides H2 defaults below — see application-mysql.properties
