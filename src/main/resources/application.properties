spring.application.name=testvue
spring.main.banner-mode=off
spring.web.resources.static-locations=classpath:/static/,file:target/allure-report
logging.level.com.microsoft.playwright=OFF
logging.level.org.apache.http=ERROR
logging.level.org.springframework=WARN
logging.level.root=WARN

# Default: H2 in-memory (works without MySQL)
spring.datasource.url=jdbc:h2:mem:taas;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# To use MySQL instead, add --spring.profiles.active=mysql to the command line
# See application-mysql.properties
